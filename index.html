<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MarketMinds — Digital Marketing &amp; Growth Agency</title>
    <meta name="description" content="MarketMinds is a full-service digital agency crafting brand, web and performance marketing strategies that turn attention into growth. Led by Dhruv Verma." />

    <!-- Open Graph -->
    <meta property="og:title" content="MarketMinds — Digital Marketing & Growth Agency" />
    <meta property="og:description" content="Brand, web and performance marketing, crafted with intention. MarketMinds turns attention into growth." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon-512.png" />

    <!-- Fonts: Fraunces (display), Inter (body), Space Mono (labels/data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Prevent flash of wrong theme before React mounts
      (function () {
        try {
          var stored = localStorage.getItem('mm-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.classList.toggle('dark', theme !== 'light');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
